<style>
  :root { --fg:#1c2833; --muted:#5d6d7e; --line:#d5dbdb; --accent:#21618c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--fg); }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; top:12px; left:12px; right:auto;
           background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:10px;
           padding:12px 14px; box-shadow:0 2px 10px rgba(0,0,0,.12); width:340px; max-width:calc(100vw - 24px); }
  .panel h1 { font-size:15px; margin:0 0 2px; }
  .panel p.sub { font-size:12px; color:var(--muted); margin:0 0 10px; }
  .row { display:flex; align-items:center; gap:10px; }
  button#play { font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:6px;
                background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .yearline { display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; }
  .yearline b { font-size:22px; color:var(--accent); }
  .yearline span { font-size:12px; color:var(--muted); }
  .legend { position:absolute; z-index:1000; bottom:20px; right:12px; background:rgba(255,255,255,.95);
            border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:11px; color:var(--muted); }
  .legend .bar { width:120px; height:10px; border-radius:3px; margin:4px 0;
                 background:linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725); }
  .legend .ends { display:flex; justify-content:space-between; }
  .leaflet-popup-content { font-size:12.5px; line-height:1.4; }
  .leaflet-popup-content b { font-size:13px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Centros de Acceso a Justicia</h1>
  <p class="sub">Apertura por año y ubicación. Deslizá o presioná ▶ para ver cómo se abrieron en el tiempo. Clic en un punto para ver el detalle.</p>
  <div class="row">
    <button id="play">▶ Reproducir</button>
    <input type="range" id="slider" />
  </div>
  <div class="yearline"><b id="yearLabel"></b><span id="count"></span></div>
</div>
<div class="legend">
  Año de apertura
  <div class="bar"></div>
  <div class="ends"><span id="legMin"></span><span id="legMax"></span></div>
</div>

const { ymin, ymax, centros } = DATA;

const map = L.map("map", { scrollWheelZoom: true });
L.tileLayer("https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_3xqo_1_5cf85321beeff00bbb316478", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>', maxZoom: 19
}).addTo(map);

// viridis stops → color by year fraction
const VIRIDIS = ["#440154","#3b528b","#21918c","#5ec962","#fde725"];
function lerp(a,b,t){return Math.round(a+(b-a)*t);}
function hex(c){const n=parseInt(c.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function colorFor(anio){
  const t = ymax===ymin ? 0 : (anio-ymin)/(ymax-ymin);
  const x = t*(VIRIDIS.length-1), i = Math.min(Math.floor(x), VIRIDIS.length-2), f = x-i;
  const a = hex(VIRIDIS[i]), b = hex(VIRIDIS[i+1]);
  return `rgb(${lerp(a[0],b[0],f)},${lerp(a[1],b[1],f)},${lerp(a[2],b[2],f)})`;
}

const layer = L.layerGroup().addTo(map);
const all = centros.map(c => {
  const m = L.circleMarker([c.lat, c.lon], {
    radius: 6, weight: 1.5, color: "#fff", fillColor: colorFor(c.anio), fillOpacity: 0.9
  });
  m.bindPopup(
    `<b>${c.oficina}</b><br>${c.loc}, ${c.prov}<br>${c.dom}<br>Apertura: ${c.fecha}`
  );
  m.bindTooltip(c.oficina, { direction: "top" });
  return { c, m };
});
map.fitBounds(L.latLngBounds(centros.map(c => [c.lat, c.lon])).pad(0.08));

const slider = document.getElementById("slider");
slider.min = ymin; slider.max = ymax; slider.step = 1; slider.value = ymax;
document.getElementById("legMin").textContent = ymin;
document.getElementById("legMax").textContent = ymax;

function render(y) {
  y = +y;
  layer.clearLayers();
  let n = 0;
  for (const {c, m} of all) if (c.anio <= y) { layer.addLayer(m); n++; }
  document.getElementById("yearLabel").textContent = y;
  document.getElementById("count").textContent = `${n} de ${centros.length} centros abiertos`;
}
slider.addEventListener("input", () => { stop(); render(slider.value); });

let timer = null;
const btn = document.getElementById("play");
function stop(){ if (timer){ clearInterval(timer); timer=null; btn.textContent="▶ Reproducir"; } }
btn.addEventListener("click", () => {
  if (timer) { stop(); return; }
  if (+slider.value >= ymax) slider.value = ymin;   // restart if at end
  render(slider.value);
  btn.textContent = "⏸ Pausar";
  timer = setInterval(() => {
    let y = +slider.value;
    if (y >= ymax) { stop(); return; }
    slider.value = y + 1; render(slider.value);
  }, 600);
});

render(ymax);
</script>
